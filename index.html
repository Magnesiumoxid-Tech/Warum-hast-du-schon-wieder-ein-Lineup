<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAKTIK-BOARD · VALORANT LINEUP-REGISTER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

    :root {
      --bp-bg: #0d2137;
      --bp-grid: rgba(56, 189, 248, 0.15);
      --bp-grid-sub: rgba(56, 189, 248, 0.05);
      --bp-panel: #112a46;
      --bp-panel-hover: #163456;
      --bp-border: #38bdf8;
      --bp-border-dim: #1e4976;
      --bp-text: #e0f2fe;
      --bp-text-dim: #7dd3fc;
      --bp-yellow: #facc15;
      --bp-yellow-dim: rgba(250, 204, 21, 0.12);
      --bp-font-mono: 'Share Tech Mono', monospace;
      --bp-font-main: 'Chakra Petch', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bp-bg);
      background-image: 
        linear-gradient(var(--bp-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bp-grid) 1px, transparent 1px),
        linear-gradient(var(--bp-grid-sub) 1px, transparent 1px),
        linear-gradient(90deg, var(--bp-grid-sub) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
      color: var(--bp-text);
      font-family: var(--bp-font-main);
      min-height: 100vh;
      padding: 0.75rem;
    }

    /* Outer Wrapper Blueprint Frame */
    .blueprint-wrapper {
      border: 1px solid var(--bp-border);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
      background: rgba(13, 33, 55, 0.92);
      padding: 0.75rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Title Block Header */
    .title-header {
      border: 1px solid var(--bp-border-dim);
      background: var(--bp-panel);
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .title-header .sub {
      font-family: var(--bp-font-mono);
      font-size: 0.7rem;
      color: var(--bp-text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .title-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .title-header h1 span {
      color: var(--bp-yellow);
      background: var(--bp-yellow-dim);
      padding: 0 4px;
    }

    .btn-blue-subtle {
      background: rgba(30, 73, 118, 0.6);
      color: var(--bp-text-dim);
      font-family: var(--bp-font-mono);
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid var(--bp-border-dim);
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .btn-blue-subtle:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--bp-border);
      color: #fff;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
    }

    /* Control Matrix (Top Controls) */
    .control-panel {
      border: 1px solid var(--bp-border-dim);
      background: var(--bp-panel);
      display: grid;
      grid-template-columns: 1.1fr 2.2fr 1.1fr 1fr 2fr;
      gap: 0;
      margin-bottom: 0.75rem;
    }

    .matrix-box {
      border-right: 1px solid var(--bp-border-dim);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .matrix-box:last-child {
      border-right: none;
    }

    .matrix-title {
      font-family: var(--bp-font-mono);
      font-size: 0.75rem;
      color: var(--bp-border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.2rem;
    }

    .matrix-title span {
      border: 1px solid var(--bp-yellow);
      color: var(--bp-yellow);
      font-size: 0.65rem;
      padding: 0 4px;
    }

    .btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    /* Vertikaler Stapel für Agent, Seite, Spot */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }

    /* Größere, griffigere Buttons */
    .bp-btn {
      background: transparent;
      border: 1px solid var(--bp-border-dim);
      color: var(--bp-text-dim);
      font-family: var(--bp-font-mono);
      font-size: 0.9rem;
      padding: 0.55rem 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      width: 100%;
    }

    /* Für Map-Grid (wo Buttons nebeneinander liegen) */
    .btn-grid .bp-btn {
      width: auto;
      flex: 1 1 calc(33.33% - 0.4rem);
      min-width: 85px;
    }

    .bp-btn:hover {
      border-color: var(--bp-border);
      color: #fff;
      background: rgba(56, 189, 248, 0.1);
    }

    .bp-btn.active {
      border-color: var(--bp-yellow);
      color: var(--bp-yellow);
      background: var(--bp-yellow-dim);
      font-weight: bold;
    }

    /* Minimap View Box - Groß & Prominent */
    .map-preview-box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.6rem;
      background: rgba(0, 0, 0, 0.35);
      min-height: 250px;
    }

    .map-tag {
      position: absolute;
      font-family: var(--bp-font-mono);
      font-size: 0.75rem;
      color: var(--bp-yellow);
      background: rgba(13, 33, 55, 0.95);
      padding: 2px 8px;
      border: 1px solid var(--bp-yellow);
      z-index: 2;
    }

    .map-tag.top-right { top: 8px; right: 8px; }
    .map-tag.bottom-right { bottom: 8px; right: 8px; }

    .minimap-img {
      max-height: 230px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .minimap-img.rotated {
      transform: rotate(180deg);
    }

    /* Breadcrumb & Match Bar */
    .status-bar {
      border: 1px solid var(--bp-border-dim);
      background: var(--bp-panel);
      padding: 0.45rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--bp-font-mono);
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }

    .status-path {
      color: var(--bp-text-dim);
    }

    .status-count {
      color: var(--bp-yellow);
      font-weight: bold;
    }

    /* Lineup Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 0.75rem;
    }

    /* Lineup Card Blueprint */
    .lu-card {
      border: 1px solid var(--bp-border-dim);
      background: var(--bp-panel);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color 0.2s ease;
    }

    .lu-card:hover {
      border-color: var(--bp-border);
    }

    .lu-card-header {
      background: rgba(56, 189, 248, 0.08);
      border-bottom: 1px solid var(--bp-border-dim);
      padding: 0.35rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--bp-font-mono);
      font-size: 0.65rem;
      color: var(--bp-text-dim);
    }

    .lu-card-title {
      font-family: var(--bp-font-main);
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      padding: 0.35rem 0.6rem 0.05rem 0.6rem;
    }

    .lu-card-sub {
      font-family: var(--bp-font-mono);
      font-size: 0.7rem;
      color: var(--bp-yellow);
      padding: 0 0.6rem 0.4rem 0.6rem;
    }

    .lu-card-body {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--bp-border-dim);
    }

    .lu-content {
      flex: 1;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .lu-img-box {
      border: 1px solid var(--bp-border-dim);
      background: #061322;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .lu-img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .lu-details {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .lu-box {
      border: 1px solid var(--bp-border-dim);
      background: rgba(13, 33, 55, 0.5);
      padding: 0.3rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
    }

    .lu-box-num {
      font-family: var(--bp-font-mono);
      font-size: 0.6rem;
      color: var(--bp-yellow);
      border: 1px solid var(--bp-yellow);
      display: inline-block;
      padding: 0 3px;
      width: fit-content;
      line-height: 1;
    }

    .lu-box-label {
      font-family: var(--bp-font-mono);
      font-size: 0.62rem;
      color: var(--bp-text-dim);
      text-transform: uppercase;
    }

    .lu-box-val {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 33, 55, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal.active { display: flex; }

    .modal-img {
      max-width: 92vw;
      max-height: 92vh;
      border: 1px solid var(--bp-yellow);
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.25);
    }

    @media (max-width: 1200px) {
      .control-panel {
        grid-template-columns: 1fr 2fr 1fr;
      }
      .map-preview-box {
        grid-column: span 3;
      }
    }

    @media (max-width: 768px) {
      .control-panel {
        grid-template-columns: 1fr;
      }
      .map-preview-box {
        grid-column: span 1;
      }
    }
  </style>
</head>

  <div class="blueprint-wrapper">
    <!-- Header -->

      <div class="matrix-box">

        <div class="btn-stack" id="agentFilter">
          <button class="bp-btn active" onclick="setFilter('agent', 'Brimstone')">Brimstone</button>
          <button class="bp-btn" onclick="setFilter('agent', 'KAY/O')">KAY/O</button>
          <button class="bp-btn" onclick="setFilter('agent', 'Sova')">Sova</button>
        </div>
      </div>

      <!-- 02 Map -->
      <div class="matrix-box">
        <div class="matrix-title"><span>02</span> MAP</div>
        <div class="btn-grid" id="mapFilter">
          <button class="bp-btn" onclick="setFilter('map', 'Abyss')">Abyss</button>
          <button class="bp-btn active" onclick="setFilter('map', 'Ascent')">Ascent</button>
          <button class="bp-btn" onclick="setFilter('map', 'Bind')">Bind</button>
          <button class="bp-btn" onclick="setFilter('map', 'Breeze')">Breeze</button>
          <button class="bp-btn" onclick="setFilter('map', 'Corrode')">Corrode</button>
          <button class="bp-btn" onclick="setFilter('map', 'Fracture')">Fracture</button>
          <button class="bp-btn" onclick="setFilter('map', 'Haven')">Haven</button>
          <button class="bp-btn" onclick="setFilter('map', 'Icebox')">Icebox</button>
          <button class="bp-btn" onclick="setFilter('map', 'Lotus')">Lotus</button>
          <button class="bp-btn" onclick="setFilter('map', 'Pearl')">Pearl</button>
          <button class="bp-btn" onclick="setFilter('map', 'Split')">Split</button>
          <button class="bp-btn" onclick="setFilter('map', 'Sunset')">Sunset</button>
          <button class="bp-btn" onclick="setFilter('map', 'ALL MAPS')">ALL MAPS</button>
        </div>
      </div>

      <!-- 03 Seite -->
      <div class="matrix-box">
        <div class="matrix-title"><span>03</span> SEITE</div>
        <div class="btn-stack" id="sideFilter">
          <button class="bp-btn active" onclick="setFilter('side', 'Attacker')">Attacker</button>
          <button class="bp-btn" onclick="setFilter('side', 'Defender')">Defender</button>
        </div>
      </div>

      <!-- 04 Spot -->
      <div class="matrix-box">
        <div class="matrix-title"><span>04</span> SPOT</div>
        <div class="btn-stack" id="spotFilter">
          <!-- Wird dynamisch per JavaScript befüllt (A/B oder A/B/C) -->
        </div>
      </div>

      <!-- Minimap Preview -->
      <div class="map-preview-box">
        <div class="matrix-title" style="position: absolute; top: 8px; left: 8px;">GRUNDRISS</div>
        <div class="map-tag top-right" id="sideBadge">ATK</div>
        <img id="minimapImg" class="minimap-img" src="https://placehold.co/300x300/0d2137/38bdf8?text=MINIMAP" alt="Minimap">
        <div class="map-tag bottom-right" id="mapNameBadge">ABYSS</div>
      </div>
    </section>

      <div class="status-path" id="statusBreadcrumb">Brimstone / Abyss / Attacker / Spot A</div>
      <div class="status-count" id="statusCount">0 Treffer</div>
    </div>

    <!-- Lineup Cards Grid -->
    <main class="cards-grid" id="lineupGrid">
      <!-- Dynamisch -->
    </main>
  </div>

  <!-- Lightbox Modal -->

		'Icebox': -90,
		'Split': 90,

    // Lokale Bilder Speichern
    const loadedImages = {};

    document.getElementById('fileInput').addEventListener('change', (e) => {
      for (let file of e.target.files) {
        loadedImages[file.name] = URL.createObjectURL(file);
      }
      render();
    });

    // Spot-Buttons dynamisch je nach Map rendern (A, B oder A, B, C oder alle)
    function updateSpotFilter() {
      const spotContainer = document.getElementById('spotFilter');
      spotContainer.innerHTML = '';

      if (currentFilters.map === 'ALL MAPS') {
        const span = document.createElement('div');
        span.style.cssFont = 'var(--bp-font-mono)';
        span.style.fontSize = '0.75rem';
        span.style.color = 'var(--bp-text-dim)';
        span.style.padding = '0.4rem 0';
        span.innerText = 'ALLE SPOTS';
        spotContainer.appendChild(span);
        return;
      }

      const hasC = (currentFilters.map === 'Haven' || currentFilters.map === 'Lotus');
      const spots = hasC ? ['A', 'B', 'C'] : ['A', 'B'];

      if (!spots.includes(currentFilters.spot)) {
        currentFilters.spot = 'A';
      }

      spots.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `bp-btn ${currentFilters.spot === s ? 'active' : ''}`;
        btn.innerText = s;
        btn.onclick = () => setFilter('spot', s);
        spotContainer.appendChild(btn);
      });
    }

    // Filter setzen
    function setFilter(type, val) {
      currentFilters[type] = val;

      if (type === 'map') {
        updateSpotFilter();
      }

      const container = document.getElementById(type + 'Filter');
      if (container) {
        const btns = container.querySelectorAll('.bp-btn');
        btns.forEach(b => {
          if (b.innerText === val) b.classList.add('active');
          else b.classList.remove('active');
        });
      }

      render();
    }

    // Rendern
    function render() {
      const isAllMaps = (currentFilters.map === 'ALL MAPS');

      document.getElementById('statusBreadcrumb').innerText = isAllMaps 
        ? `${currentFilters.agent} / ALLE MAPS (Ungefiltert)`
        : `${currentFilters.agent} / ${currentFilters.map} / ${currentFilters.side} / Spot ${currentFilters.spot}`;
      
      document.getElementById('sideBadge').innerText = isAllMaps ? 'ALL' : (currentFilters.side === 'Attacker' ? 'ATK' : 'DEF');
      document.getElementById('mapNameBadge').innerText = currentFilters.map.toUpperCase();

      const minimapImg = document.getElementById('minimapImg');
      minimapImg.src = mapMinimaps[currentFilters.map] || 'https://placehold.co/300x300/0d2137/38bdf8?text=' + currentFilters.map;

	  let degrees = mapRotations[currentFilters.map] || 0; 

      if (!isAllMaps && currentFilters.side === 'Defender') {
        degrees += 180;
      }
	   
	  minimapImg.style.transform = 'rotate(${degrees}deg)';
	   
      const filtered = lineups.filter(l => {
        if (l.agent !== currentFilters.agent) return false;
        if (isAllMaps) return true; // Bei ALL MAPS alle Lineups des Agents zeigen
        return l.map === currentFilters.map &&
               l.side === currentFilters.side &&
               l.spot === currentFilters.spot;
      });

      document.getElementById('statusCount').innerText = `${filtered.length} Treffer`;

      const grid = document.getElementById('lineupGrid');
      grid.innerHTML = '';

      filtered.forEach((l, idx) => {
        const imgSrc = loadedImages[l.filename] || l.filename;

        const card = document.createElement('div');
        card.className = 'lu-card';
        card.innerHTML = `
          <div class="lu-card-header">
            <span>${l.map.toUpperCase()} · SPOT ${l.spot}</span>
            <span>${l.agent.toUpperCase()} · ${l.side.toUpperCase()}</span>
          </div>
          <div class="lu-card-title">${l.title}</div>
          <div class="lu-card-sub">▸ Incendiary (Molly)</div>
          <div class="lu-card-body">
            <div class="lu-content">
              <div class="lu-img-box" onclick="openModal('Lineups_Bilder/${imgSrc}')">
                <img src="Lineups_Bilder/${imgSrc}" alt="${l.title}" onerror="this.src='https://placehold.co/600x337/0d2137/38bdf8?text=${encodeURIComponent(l.filename)}'">
              </div>
              <div class="lu-details">
                <div class="lu-box">
                  <span class="lu-box-num">01</span>
                  <span class="lu-box-label">VON</span>
                  <span class="lu-box-val">${l.von}</span>
                </div>
                <div class="lu-box">
                  <span class="lu-box-num">02</span>
                  <span class="lu-box-label">ZIEL</span>
                  <span class="lu-box-val">${l.aim}</span>
                </div>
                <div class="lu-box">
                  <span class="lu-box-num">03</span>
                  <span class="lu-box-label">TREFFER</span>
                  <span class="lu-box-val" style="color:var(--bp-yellow);">${l.hit}</span>
                </div>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    // Initial Start beim Laden
    updateSpotFilter();
    render();
  </script>
</body>
</html>
